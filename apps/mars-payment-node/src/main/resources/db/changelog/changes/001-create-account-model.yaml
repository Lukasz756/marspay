databaseChangeLog:
  - changeSet:
      id: 001-create-account-model
      author: lukasz756
      changes:
        - createTable:
            tableName: account_holder
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_account_holder
              - column:
                  name: reference
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: account_holder
            columnNames: reference
            constraintName: uq_account_holder_reference

        - createTable:
            tableName: balance_account
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_balance_account
              - column:
                  name: account_holder_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: available_balance_minor
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reserved_balance_minor
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: balance_account
            columnNames: account_holder_id, currency
            constraintName: uq_balance_account_holder_currency

        - sql:
            sql: >
              ALTER TABLE balance_account
              ADD CONSTRAINT ck_balance_account_available_non_negative
              CHECK (available_balance_minor >= 0)

        - sql:
            sql: >
              ALTER TABLE balance_account
              ADD CONSTRAINT ck_balance_account_reserved_non_negative
              CHECK (reserved_balance_minor >= 0)

        - addForeignKeyConstraint:
            baseTableName: balance_account
            baseColumnNames: account_holder_id
            referencedTableName: account_holder
            referencedColumnNames: id
            constraintName: fk_balance_account_account_holder