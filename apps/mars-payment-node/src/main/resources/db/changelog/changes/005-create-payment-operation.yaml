databaseChangeLog:
  - changeSet:
      id: 005-create-payment-operation
      author: lukasz756
      changes:
        - createTable:
            tableName: payment_operation
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_payment_operation

              - column:
                  name: payment_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: amount_minor
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: payment_operation
            baseColumnNames: payment_id
            referencedTableName: payment
            referencedColumnNames: id
            constraintName: fk_payment_operation_payment

        - sql:
            sql: >
              ALTER TABLE payment_operation
              ADD CONSTRAINT ck_payment_operation_amount_positive
              CHECK (amount_minor > 0)

        - createIndex:
            tableName: payment_operation
            indexName: idx_payment_operation_payment_created_at
            columns:
              - column:
                  name: payment_id
              - column:
                  name: created_at