databaseChangeLog:
  - changeSet:
      id: 002-create-balance-operation
      author: lukasz756
      changes:
        - createTable:
            tableName: balance_operation

            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_balance_operation
              - column:
                  name: balance_account_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: amount_minor
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: available_balance_after_minor
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reserved_balance_after_minor
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: balance_operation
            columnNames: balance_account_id, reference
            constraintName: uq_balance_operation_account_reference

        - addForeignKeyConstraint:
            baseTableName: balance_operation
            baseColumnNames: balance_account_id
            referencedTableName: balance_account
            referencedColumnNames: id
            constraintName: fk_balance_operation_balance_account

        - sql:
            sql: >
              ALTER TABLE balance_operation
              ADD CONSTRAINT ck_balance_operation_amount_positive
              CHECK (amount_minor > 0)

        - sql:
            sql: >
              ALTER TABLE balance_operation
              ADD CONSTRAINT ck_balance_operation_available_non_negative
              CHECK (available_balance_after_minor >= 0)

        - sql:
            sql: >
              ALTER TABLE balance_operation
              ADD CONSTRAINT ck_balance_operation_reserved_non_negative
              CHECK (reserved_balance_after_minor >= 0)

        - createIndex:
            tableName: balance_operation
            indexName: idx_balance_operation_account_created_at
            columns:
              - column:
                  name: balance_account_id
              - column:
                  name: created_at