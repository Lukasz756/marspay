databaseChangeLog:
  - changeSet:
      id: 006-create-idempotency-record
      author: lukasz756
      changes:
        - createTable:
            tableName: idempotency_record
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_idempotency_record

              - column:
                  name: scope
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: response_status
                  type: INTEGER

              - column:
                  name: response_body
                  type: TEXT

              - column:
                  name: response_location
                  type: VARCHAR(255)

              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: idempotency_record
            columnNames: scope, idempotency_key
            constraintName: uq_idempotency_record_scope_key

        - sql:
            sql: >
              ALTER TABLE idempotency_record
              ADD CONSTRAINT ck_idempotency_response_status
              CHECK (
                response_status IS NULL
                OR response_status BETWEEN 100 AND 599
              )

        - sql:
            sql: >
              ALTER TABLE idempotency_record
              ADD CONSTRAINT ck_idempotency_completion
              CHECK (
                (status = 'IN_PROGRESS'
                  AND response_status IS NULL
                  AND response_body IS NULL
                  AND response_location IS NULL)
                OR
                (status = 'COMPLETED'
                  AND response_status IS NOT NULL
                  AND response_body IS NOT NULL)
              )

        - createIndex:
            tableName: idempotency_record
            indexName: idx_idempotency_record_created_at
            columns:
              - column:
                  name: created_at