services:
  mars-payment-node-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${MARSPAY_MARS_DB_NAME}"
      POSTGRES_USER: "${MARSPAY_MARS_DB_USERNAME}"
      POSTGRES_PASSWORD: "${MARSPAY_MARS_DB_PASSWORD}"
    ports:
      - "${MARSPAY_MARS_DB_PORT}:5432"
    volumes:
      - mars-payment-node-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  interplanetary-relay-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${MARSPAY_RELAY_DB_NAME}"
      POSTGRES_USER: "${MARSPAY_RELAY_DB_USERNAME}"
      POSTGRES_PASSWORD: "${MARSPAY_RELAY_DB_PASSWORD}"
    ports:
      - "${MARSPAY_RELAY_DB_PORT}:5432"
    volumes:
      - interplanetary-relay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  earth-payment-service-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${MARSPAY_EARTH_DB_NAME}"
      POSTGRES_USER: "${MARSPAY_EARTH_DB_USERNAME}"
      POSTGRES_PASSWORD: "${MARSPAY_EARTH_DB_PASSWORD}"
    ports:
      - "${MARSPAY_EARTH_DB_PORT}:5432"
    volumes:
      - earth-payment-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mars-payment-node-db-data:
  interplanetary-relay-db-data:
  earth-payment-service-db-data: